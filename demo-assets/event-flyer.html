<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Demo flyer — screenshot this</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 10%, #1e1b4b, #0f172a 60%);
    font-family: "DM Sans", sans-serif; color: #fff;
  }
  .flyer {
    width: 380px; padding: 40px 34px; border-radius: 24px;
    background: linear-gradient(160deg, #7C3AED, #4338CA);
    box-shadow: 0 30px 80px -20px rgba(124,58,237,0.6);
    text-align: center;
  }
  .eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }
  h1 { font-family: "Space Grotesk", sans-serif; font-size: 32px; margin: 10px 0 18px; line-height: 1.15; }
  .detail { font-size: 15px; margin: 6px 0; opacity: 0.95; }
  .detail b { font-weight: 700; }
</style>
</head>
<body>
  <div class="flyer">
    <div class="eyebrow">You're invited</div>
    <h1>Design Team Offsite</h1>
    <div class="detail"><b>Friday, Oct 3 &middot; 10:00 AM</b></div>
    <div class="detail">Conference Room B, 4th Floor</div>
    <div class="detail" style="margin-top:14px;opacity:0.75">Bring your laptop. Coffee provided.</div>
  </div>
</body>
</html>
